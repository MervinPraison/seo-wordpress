# Generated by praisonaiui.mkdocs_import from mkdocs.yml.
# The MkDocs file is left unchanged. aiui build reads this file.
# Dropped: pymdownx.snippets includes are not expanded; the include lines stay in the page.
# Dropped: ignored YAML tag !!python/name:pymdownx.superfences.fence_code_format
schemaVersion: 1
site:
  title: Praison SEO WordPress
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: Powerful WordPress SEO Plugin with Meta Optimization, Sitemaps & Breadcrumbs
seo:
  siteUrl: https://seo.praison.ai
navigation:
  tabs:
  - tab: Docs
    groups:
    - group: Get started
      pages:
      - index
      icon: rocket
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/configuration
      icon: rocket
      prefix: getting-started
    - group: Features
      pages:
      - features/meta-description
      - features/meta-optimization
      - features/title-optimization
      - features/sitemap
      - features/breadcrumbs
      - features/analytics
      - features/webmaster-verification
      icon: book-open
      prefix: features
    - group: Guides
      pages:
      - guides/best-practices
      - guides/troubleshooting
      icon: book-open
      prefix: guides
navbar:
  primary:
    type: button
    label: Quick start
    href: /docs/getting-started/installation
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/seo-wordpress
footer:
  socials:
    github: https://github.com/MervinPraison/seo-wordpress
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
    nav:
      mode: manual
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: Praison SEO WordPress
  footer_main:
    type: Footer
    props:
      text: Praison SEO WordPress
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
